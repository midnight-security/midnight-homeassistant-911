[project]
name = "midnight_alerts"
version = "0.4.0"
description = "Midnight Security 911 Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant~=2026.7.0",
    "sentry-sdk==2.66.1",
    "bcrypt==5.0.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.347",
    "ruff>=0.14.1",
]

[tool.uv]
required-version = ">=0.8.0"

[tool.ruff]
line-length = 88         # Matches black
show-fixes = true
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "D105",    #missing-docstring-in-init
    "PLR2004", #Magic Values
    "PLR0917", #too-many-positional-arguments
    "D203",    #no-blank-line-before-class
    "D212",    #multi-line-summary-first-line
]
select = [
    "I",   # isort
    "F",   # plake8-bugbear
    "E",   # pycoyflakes
    "W",
    "D",   # pydocstyle
    "PL",  # pylint
    "RUF", # ruff
    "UP",  # pyupgrade
]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
length-sort = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
