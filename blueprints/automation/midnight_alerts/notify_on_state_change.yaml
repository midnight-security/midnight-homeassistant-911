blueprint:
  name: Midnight Alarm - Notify on State Change
  description: >-
    Runs a notification (or any other action) whenever a Midnight Alarm
    area changes to one of the states you pick - armed, disarmed,
    triggered, or any other alarm_control_panel state. Broader than the
    dedicated "Notify on Trigger" blueprint, which only covers the
    triggered case; use this one to also cover arm/disarm events,
    mirroring Alarmo's own per-event notification setup - with the area's
    full state attributes available for templating instead of a fixed
    wildcard list.
  domain: automation
  source_url: https://github.com/midnight-security/midnight-homeassistant-911/blob/master/blueprints/automation/midnight_alerts/notify_on_state_change.yaml
  author: Midnight Security
  input:
    alarm_entity:
      name: Midnight Alarm area
      description: The alarm_control_panel entity to watch.
      selector:
        entity:
          filter:
            - domain: alarm_control_panel
    watched_states:
      name: States to notify on
      description: Run the action whenever the area changes to any of these.
      default:
        - armed_away
        - armed_home
        - disarmed
        - triggered
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: Armed Away
              value: armed_away
            - label: Armed Home
              value: armed_home
            - label: Armed Night
              value: armed_night
            - label: Armed Vacation
              value: armed_vacation
            - label: Armed Custom Bypass
              value: armed_custom_bypass
            - label: Disarmed
              value: disarmed
            - label: Triggered
              value: triggered
            - label: Pending
              value: pending
            - label: Arming
              value: arming
    notify_action:
      name: Notification action
      description: >-
        What to run on a watched state change - a notify action, a script,
        or any other action sequence. Templates can use
        `trigger.to_state.state` for the new state,
        `trigger.from_state.state` for the previous one,
        `trigger.to_state.attributes.changed_by` for who armed/disarmed
        (mirrors Alarmo's `{{changed_by}}` wildcard), and
        `trigger.to_state.attributes.friendly_name` for the area's name.
      selector:
        action: {}

mode: queued

triggers:
  - trigger: state
    entity_id: !input alarm_entity
    to: !input watched_states

actions: !input notify_action
