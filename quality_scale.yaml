rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register any service actions.
  appropriate-polling:
    status: exempt
    comment: iot_class is cloud_push; the integration does not poll.
  brands:
    status: done
    comment: >-
      custom_components/midnight_alerts/brand/ (icon/logo, dark variants,
      @2x) - read directly by HA Core 2026.3.0+ per the Brands Proxy API,
      no manifest key needed. Requires 2026.3.0+ to actually render; won't
      show on older cores. This repo's dev instance was upgraded to Python
      3.14 / HA Core 2026.7.3 specifically to verify this renders
      correctly - confirmed working.
  common-modules:
    status: done
    comment: >-
      Two platforms now exist (button, alarm_control_panel). Shared logic is
      factored into standalone modules rather than duplicated or left inline
      on the entity: pin.py (PIN hashing/verification), sensors.py
      (entity-registry-options helpers), alarm_state.py (state-machine math),
      sensor_groups.py (N-of-M tally), alarmo_import.py (migration parser).
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: >-
      API client code lives inline in api.py rather than in a separate,
      pinned third-party PyPI package. See CORE_INTEGRATION.md.
  docs-actions:
    status: exempt
    comment: Integration does not provide service actions.
  docs-conditions:
    status: exempt
    comment: Integration does not provide conditions.
  docs-triggers:
    status: exempt
    comment: Integration does not provide triggers.
  docs-high-level-description:
    status: done
    comment: >-
      docs/midnight_alerts.markdown's intro now covers both the Trigger
      Alert button and the native Midnight Alarm alarm_control_panel
      platform (areas, users/PINs, sensor groups, Alarmo import) - it
      previously only described the button.
  docs-installation-instructions:
    status: done
    comment: >-
      Covers the initial API-key config flow plus step-by-step instructions
      for adding an area, attaching sensors, adding users, sensor groups,
      and the Alarmo import flow.
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: >-
      Neither platform polls. The button has no state to track. The alarm
      area entity is fully event/callback-driven: async_track_state_change_event
      for sensors, async_track_point_in_time for scheduled transitions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: __init__.py now sets entry.runtime_data; both platforms read from it.
  test-before-configure:
    status: done
    comment: >-
      async_step_user calls async_validate before creating the entry -
      skipped only when the API key field was intentionally left blank,
      which is itself a supported setup path (see config_flow.py's
      async_step_user docstring), not a bypass of this rule.
  test-before-setup:
    status: done
    comment: >-
      async_setup_entry re-validates on every load, raising
      ConfigEntryAuthFailed/ConfigEntryNotReady as appropriate - same
      blank-key exemption as test-before-configure above.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      pin.async_validate_code raises ServiceValidationError (translation_key
      "invalid_code") for a wrong or unauthorized PIN on any arm/disarm call.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: >-
      docs/midnight_alerts.markdown's Configuration section documents that
      enable_crash_reporting is revisitable anytime via Reconfigure, not
      just a first-run choice - there's no separate options step to
      document instead.
  docs-installation-parameters:
    status: done
    comment: >-
      docs/midnight_alerts.markdown's Configuration section documents both
      of the config flow's fields (API Key, and enable_crash_reporting -
      asked at setup rather than buried in a separate options step, so
      consent is explicit before any data leaves the house) and the
      location-verification check performed at setup.
  entity-unavailable:
    status: exempt
    comment: >-
      alarm_control_panel.py's MidnightAlarmArea makes zero network calls
      (pure local state machine - sensor events, PIN checks, scheduled
      callbacks), so there's nothing to check. button.py's
      MidnightAlertButton is the only entity that calls the network, but
      setting _attr_available = False on a failed press would get it
      filtered out of all future button.press calls by HA's own
      entity_service_call dispatch (helpers/service.py's
      _resolve_entity_service_call_entities) - and with no
      polling/coordinator, nothing would ever flip it back. That's a
      permanent lockout of the emergency alert button after one transient
      failure, not an improvement. Always-available + a real logged error
      on press is the safer behavior here (see button.py's docstring).
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: >-
      Same reasoning as entity-unavailable - no unavailable state is ever
      entered on either entity, so there's no transition to log once
      rather than spam. A failed button press already logs via
      _LOGGER.error in async_press today, so failures aren't silent.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 set on both button.py and alarm_control_panel.py.
  reauthentication-flow:
    status: done
    comment: >-
      MidnightAlertsConfigFlow.async_step_reauth delegates to
      async_step_user itself (same single-field form, same location
      check), branching only at the end on self.source ==
      config_entries.SOURCE_REAUTH to call async_update_reload_and_abort
      instead of async_create_entry - the openexchangerates pattern.
      __init__.py already raised ConfigEntryAuthFailed on an invalid key,
      which is what triggers HA core's automatic reauth prompt; this was
      the only missing piece.
  test-coverage:
    status: done
    comment: >-
      100% overall (pytest --cov), 881/881 statements across all 13
      modules. api.py was previously the sole gap (71%, 10 lines) because
      every other test patched MidnightAlertsApiClient.async_validate
      wholesale instead of exercising _async_request itself; test_api.py
      now drives it through aioclient_mock (BASE_URL construction, the
      401/403 auth-error path, the non-200 path added when the API URL
      and error-message handling were reworked, ClientError wrapping, and
      error_reporting call args in both the enabled and default-disabled
      cases). Earlier coverage work also caught and fixed a real bug
      along the way: a second, faster sensor tripping mid-PENDING was
      silently ignored instead of shortening the countdown, because the
      gate only recognized TRIGGERED display state, not PENDING.

  # Gold
  devices:
    status: done
    comment: >-
      button.py's device and each alarm area's device both set
      entry_type=DeviceEntryType.SERVICE. Each area is its own child device
      (identifiers keyed by entry_id + subentry_id) linked back to the main
      "Midnight 911" hub device via via_device, matching ntfy's pattern for
      multiple subentry-scoped devices under one config entry.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py redacts api_key and every subentry's PIN hash. Each
      ConfigSubentry is converted via .as_dict() before redaction, since
      async_redact_data only recurses into Mapping/list and would silently
      skip a raw ConfigSubentry (a frozen dataclass) otherwise.
  discovery: exempt
  discovery-update-info: exempt
  docs-data-update: done
  docs-examples:
    status: done
    comment: >-
      Five real, schema-validated blueprints now ship at
      blueprints/automation/midnight_alerts/ (notify-on-trigger,
      notify-on-state-change, re-arm-after-timeout,
      auto-arm-away-when-everyone-leaves, retry-arm-on-failed-to-arm) -
      the direct, working replacement for Alarmo's own built-in
      notification, device-switching, and automatic-arming automation
      features (checked against Alarmo's real README, not assumed).
      Verified end-to-end: each loaded and validated against
      AUTOMATION_BLUEPRINT_SCHEMA, and instantiated with real inputs to
      confirm the resulting automation config - including the templated
      alarm_arm_{{ rearm_mode }}/{{ retry_mode }} action names, the
      expand()/selectattr() presence-check template, the mobile_app
      device-notify-action shape, and the two-trigger
      condition:-trigger/id: branching - is correct.
      docs/midnight_alerts.markdown links all five and explains the
      Import Blueprint flow. Not yet published to the community blueprint
      exchange forum - importing directly by the GitHub link works today
      without that.
  docs-known-limitations:
    status: done
    comment: >-
      Documents Alarmo-import specifics (automations counted but never
      imported) and the manage-sensors new-vs-existing-sensor caveat.
      always_on, per-sensor entry-delay override, mode-restriction, user
      area-restriction, and is_override_code all gained both manual UI and
      working behavior (previously import-only/inert); only
      use_entry_delay (the per-sensor toggle to skip the entry delay
      entirely) remains import-only, with no manual UI field yet. The new
      weighted/decaying sensor-group confirmation mode's score, like the
      existing count-window tally, doesn't survive a Home Assistant
      restart - both are documented as starting fresh after one.
  docs-supported-devices:
    status: exempt
    comment: Cloud service integration with no physical devices to support.
  docs-supported-functions:
    status: done
    comment: >-
      Table now lists both entities - the Trigger Alert button and the
      per-area Alarm Control Panel - instead of stating the button is
      "the integration's only entity" (no longer true).
  docs-troubleshooting:
    status: done
    comment: >-
      Added PIN-rejection, sensor-not-triggering, and Alarmo-import-abort
      troubleshooting sections alongside the existing config-flow ones.
  docs-use-cases:
    status: done
    comment: >-
      Previously framed the product as a button-only safety net
      "without needing a dedicated alarm panel" - now also covers running
      a full alarm system and migrating from Alarmo.
  dynamic-devices:
    status: todo
    comment: >-
      Not confidently exempt: each area subentry gets its own device,
      added/removed live without a restart - structurally identical to
      ntfy's per-topic-subentry devices, and ntfy's own quality_scale.yaml
      marks this rule `todo` rather than exempt for that exact shape.
      bosch_alarm marks it exempt, but its partitions are
      fixed/panel-discovered at connect time, not a close match. Needs a
      real read of the rule's intent (does user-initiated, in-app subentry
      creation count as "dynamic," or is this only about devices a backend
      introduces without user action?) rather than a guess.
  entity-category:
    status: done
    comment: >-
      No category set, which is correct: EntityCategory is only CONFIG or
      DIAGNOSTIC, and the alert button is the integration's primary entity.
  entity-device-class:
    status: exempt
    comment: >-
      ButtonDeviceClass only has IDENTIFY, RESTART, and UPDATE - none apply
      to an alert-trigger button.
  entity-disabled-by-default: exempt
  entity-translations:
    status: done
    comment: >-
      button.py now uses _attr_translation_key ("trigger_alert") instead of a
      hardcoded _attr_name, with entity.button.trigger_alert.name in
      translations/en.json. The alarm area entity correctly needs none -
      _attr_name = None makes it the device's unnamed primary entity, the
      same convention used throughout core (e.g. ntfy's own entities).
  exception-translations:
    status: done
    comment: >-
      pin.py's ServiceValidationError uses translation_domain=DOMAIN,
      translation_key="invalid_code", backed by exceptions.invalid_code in
      translations/en.json.
  icon-translations:
    status: todo
    comment: button.py uses a hardcoded _attr_icon instead of icons.json.
  reconfiguration-flow:
    status: done
    comment: >-
      MidnightAlertsConfigFlow.async_step_reconfigure delegates to
      async_step_user itself (same validation/location check, full form -
      the one place to change the API key AND enable_crash_reporting after
      setup; there's no separate options flow duplicating either one).
      Reauth reuses the same method but gets an API-key-only schema
      instead - it exists to fix a rejected key specifically, not to
      re-litigate crash reporting. Branches only at the end on
      self.source == config_entries.SOURCE_RECONFIGURE to call
      async_update_reload_and_abort instead of async_create_entry - the
      same pattern reauth already used. Lets a key be added (or changed)
      without removing and re-adding the entry - including filling one in
      for the first time, now that the config flow accepts a blank key at
      initial setup (the alarm engine works fully locally either way; only
      the Trigger Alert button needs a key). Unrelated to the alarm
      feature's own subentries, which already had working reconfigure
      flows (area/user/sensor_group).
  repair-issues:
    status: done
    comment: >-
      __init__.py raises two issues, both is_fixable=True with a matching
      repairs.py fix flow, both severity ERROR, both cleared automatically
      by __init__.py itself once actually resolved (never by the fix flow
      completing - see repairs.py's own docstrings on why). "location_mismatch"
      fires whenever this Home Assistant instance's own configured location
      drifts more than 1000 feet from the address on file for the API key,
      checked on every entry load; the initial config flow blocks setup
      outright on the same mismatch, so this one's specifically for catching
      drift *after* a working setup. "no_api_key" fires whenever the entry
      is loaded with no key configured at all (a supported state, not a
      setup failure - the alarm engine works fully locally regardless) so a
      user who skipped the key at setup isn't left with zero indication
      Trigger Alert won't do anything until they add one.
  stale-devices:
    status: done
    comment: >-
      Only "area" subentries have a device (identified by
      f"{entry_id}_{subentry_id}"; user/sensor_group subentries are pure
      data with no entity or device of their own, so nothing to leave
      stale there). Removing an area subentry automatically triggers HA
      core's own dev_reg.async_clear_config_subentry /
      ent_reg.async_clear_config_subentry (config_entries.py's
      async_remove_subentry), which deletes the now-orphaned device - no
      integration-side cleanup code is needed or possible. Was marked
      exempt when the only device was the single static button hub;
      that's no longer the architecture.

  # Platinum
  async-dependency:
    status: todo
    comment: Depends on the dependency-transparency PyPI extraction happening first.
  inject-websession: done
  strict-typing:
    status: todo
    comment: No mypy configuration exists yet.
