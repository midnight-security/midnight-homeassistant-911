name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Run tests
        run: >
          uv run python -m pytest tests/ -q
          --cov=custom_components.midnight_alerts
          --cov-report=term-missing
          --cov-fail-under=100

  formatting_and_linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
